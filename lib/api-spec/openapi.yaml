          schema:
            type: string
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVerification"

  /attachments:
    get:
      operationId: listAttachments
      tags: [attachments]
      summary: List uploaded attachments
      parameters:
        - name: tenantId
          in: query
          schema:
            type: integer
        - name: attachedToType
          in: query
          schema:
            type: string
        - name: attachedToId
          in: query
          schema:
            type: string
        - name: documentId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of attachments (without file content)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attachment"
    post:
      operationId: createAttachment
      tags: [attachments]
      summary: Upload a file and get back the UUID a form field stores
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttachmentInput"
      responses:
        "201":
          description: Attachment stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"

  /attachments/{uuid}:
    get:
      operationId: getAttachment
      tags: [attachments]
      summary: Get an attachment's metadata and content
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The attachment with its base64 content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttachmentWithContent"
        "404":
          description: Attachment not found

  /search:
    get:
      operationId: search
      tags: [search]
      summary: Global and entity-scoped search across indexed records
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
        - name: entityTypes
          in: query
          description: Comma-separated entity types to restrict to; omit for a global search
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Ranked results the caller is permitted to see
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GlobalSearchResponse"

  /search/entity-types:
    get:
      operationId: listSearchableEntityTypes
      tags: [search]
      summary: The entity types the search index knows how to hold
      responses:
        "200":
          description: Supported entity types
          content:
            application/json:
              schema:
                type: object
                required: [entityTypes]
                properties:
                  entityTypes:
                    type: array
                    items:
                      type: string

  /search/reindex:
    post:
      operationId: reindexSearch
      tags: [search]
      summary: Rebuild the caller's tenant search index from current records
      responses:
        "200":
          description: Per-entity-type counts of what was indexed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReindexResult"

  /integrations/endpoints:
    get:
      operationId: listIntegrationEndpoints
      tags: [integrations]
      summary: List registered integration endpoints
      responses:
        "200":
          description: Endpoints for the caller's tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntegrationEndpoint"
    post:
      operationId: createIntegrationEndpoint
      tags: [integrations]
      summary: Register an integration endpoint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationEndpointInput"
      responses:
        "201":
          description: Endpoint registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationEndpoint"
        "400":
          description: Invalid input

  /integrations/endpoints/{id}:
    get:
      operationId: getIntegrationEndpoint
      tags: [integrations]
      summary: Get an integration endpoint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The endpoint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationEndpoint"
        "404":
          description: Not found
    patch:
      operationId: updateIntegrationEndpoint
      tags: [integrations]
      summary: Update an integration endpoint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegrationEndpointUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationEndpoint"
        "404":
          description: Not found
    delete:
      operationId: deleteIntegrationEndpoint
      tags: [integrations]
      summary: Delete an integration endpoint
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /integrations/webhooks:
    get:
      operationId: listWebhooks
      tags: [integrations]
      summary: List webhook subscriptions
      responses:
        "200":
          description: Subscriptions for the caller's tenant (secrets omitted)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WebhookSubscription"
    post:
      operationId: registerWebhook
      tags: [integrations]
      summary: Register a webhook subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookSubscriptionInput"
      responses:
        "201":
          description: Created; the signing secret is returned exactly once here
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscriptionWithSecret"
        "400":
          description: Invalid input

  /integrations/webhooks/{id}:
    get:
      operationId: getWebhook
      tags: [integrations]
      summary: Get a webhook subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The subscription (secret omitted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
        "404":
          description: Not found

  /integrations/webhooks/{id}/status:
    patch:
      operationId: setWebhookStatus
      tags: [integrations]
      summary: Pause, resume, or disable a webhook subscription
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebhookStatusInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookSubscription"
        "404":
          description: Not found

  /integrations/events:
    get:
      operationId: listIntegrationEvents
      tags: [integrations]
      summary: List published integration events
      parameters:
        - name: eventType
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Events for the caller's tenant, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IntegrationEvent"
    post:
      operationId: publishIntegrationEvent
      tags: [integrations]
      summary: Publish an internal event, fanning out to matching webhook subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublishEventInput"
      responses:
        "201":
          description: Event persisted and queued for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishEventResult"
        "400":
          description: Invalid input

  /integrations/retry-queue:
    get:
      operationId: listRetryQueue
      tags: [integrations]
      summary: Inspect the outbound delivery retry queue
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, processing, delivered, failed, dead_letter]
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Retry-queue items for the caller's tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RetryQueueItem"

  /integrations/retry-queue/process:
    post:
      operationId: processRetryQueue
      tags: [integrations]
      summary: Run one worker pass over due retry-queue items
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProcessRetryQueueInput"
      responses:
        "200":
          description: Batch delivery result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProcessRetryQueueResult"

  /report-sources:
    get:
      operationId: listReportSources
      tags: [reports]
      summary: The whitelisted data sources a report may be built on, with their columns
      responses:
        "200":
          description: Available data sources
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportSource"

  /report-definitions:
    get:
      operationId: listReportDefinitions
      tags: [reports]
      summary: List report definitions
      parameters:
        - name: module
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, deprecated, archived]
      responses:
        "200":
          description: Report definitions for the caller's tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportDefinition"
    post:
      operationId: createReportDefinition
      tags: [reports]
      summary: Create a draft report definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportDefinitionInput"
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDefinition"
        "400":
          description: Invalid spec or unknown source

  /report-definitions/{id}:
    get:
      operationId: getReportDefinition
      tags: [reports]
      summary: Get a report definition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDefinition"
        "404":
          description: Not found
    patch:
      operationId: updateReportDefinition
      tags: [reports]
      summary: Update a draft report definition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportDefinitionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDefinition"
        "400":
          description: Invalid spec
        "404":
          description: Not found
        "409":
          description: Only draft definitions can be edited

  /report-definitions/{id}/publish:
    post:
      operationId: publishReportDefinition
      tags: [reports]
      summary: Activate a draft, snapshotting it and deprecating the prior active version
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Activated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportDefinition"
        "400":
          description: Spec no longer valid
        "404":
          description: Not found

  /report-definitions/{id}/run:
    post:
      operationId: runReportDefinition
      tags: [reports]
      summary: Execute a report definition and return the resulting rows
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RunReportInput"
      responses:
        "200":
          description: The report result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportRunResult"
        "404":
          description: Not found

  /report-definitions/{id}/runs:
    get:
      operationId: listReportRuns
      tags: [reports]
      summary: Execution history for a report definition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Runs, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReportRun"

  /report-preview:
    post:
      operationId: previewReport
      tags: [reports]
      summary: Validate and run an unsaved spec against a source (report builder live preview)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportPreviewInput"
      responses:
        "200":
          description: Validation result and, if valid, a bounded row sample
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReportPreviewResult"

  /scheduled-reports:
    get:
      operationId: listScheduledReports
      tags: [reports]
      summary: List scheduled reports
      responses:
        "200":
          description: Schedules for the caller's tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScheduledReport"
    post:
      operationId: createScheduledReport
      tags: [reports]
      summary: Schedule a report definition to run on a cron
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledReportInput"
      responses:
        "201":
          description: Schedule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledReport"
        "400":
          description: Invalid cron or unknown definition

  /scheduled-reports/{id}:
    patch:
      operationId: updateScheduledReport
      tags: [reports]
      summary: Enable, disable, or reschedule a scheduled report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduledReportUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduledReport"
        "400":
          description: Invalid cron
        "404":
          description: Not found
    delete:
      operationId: deleteScheduledReport
      tags: [reports]
      summary: Delete a scheduled report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /sync-entities:
    get:
      operationId: listSyncEntities
      tags: [sync]
      summary: Entity types registered for synchronization, with their conflict policies
      responses:
        "200":
          description: Registered syncable entities
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncEntity"
    post:
      operationId: registerSyncEntity
      tags: [sync]
      summary: Register an entity type for sync and set how its conflicts resolve
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncEntityInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncEntity"
        "400":
          description: Unknown conflict policy

  /sync-entities/{id}:
    patch:
      operationId: updateSyncEntity
      tags: [sync]
      summary: Change an entity's conflict policy or enable/disable its sync
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncEntityUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncEntity"
        "400":
          description: Unknown conflict policy
        "404":
          description: Not found

  /sync-nodes:
    get:
      operationId: listSyncNodes
      tags: [sync]
      summary: Registered nodes with their sync lag
      responses:
        "200":
          description: Nodes for the caller's tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncNodeStatus"
    post:
      operationId: registerSyncNode
      tags: [sync]
      summary: Register a GovCore Node
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncNodeInput"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncNode"
        "409":
          description: A node with this key already exists

  /sync-nodes/{id}:
    patch:
      operationId: updateSyncNode
      tags: [sync]
      summary: Rename a node or change its status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncNodeUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncNode"
        "404":
          description: Not found

  /sync/pull:
    post:
      operationId: pullSyncChanges
      tags: [sync]
      summary: Fetch the next batch of changes for a node and advance its cursor
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPullInput"
      responses:
        "200":
          description: A batch of changes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPullResult"
        "404":
          description: Node not found
        "409":
          description: Node is not active

  /sync/push:
    post:
      operationId: pushSyncChanges
      tags: [sync]
      summary: Submit offline changes from a node for reconciliation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncPushInput"
      responses:
        "200":
          description: Per-change outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncPushResult"
        "404":
          description: Node not found
        "409":
          description: Node is not active

  /sync-conflicts:
    get:
      operationId: listSyncConflicts
      tags: [sync]
      summary: Conflicts, optionally filtered by status
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, resolved]
      responses:
        "200":
          description: Conflicts for the caller's tenant
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SyncConflict"

  /sync-conflicts/{id}/resolve:
    post:
      operationId: resolveSyncConflict
      tags: [sync]
      summary: Settle a pending conflict by choosing a side or supplying a merge
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncConflictResolution"
      responses:
        "200":
          description: Resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncConflict"
        "400":
          description: Already resolved, or a merge without a payload
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # ── AUTH ────────────────────────────────────────────────────────────────────
    LoginInput:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    AuthResult:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserWithRoles"

    # ── TENANT ──────────────────────────────────────────────────────────────────
    Tenant:
      type: object
      required: [id, name, slug, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        contactEmail:
          type: ["string", "null"]
        contactPhone:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        province:
          type: ["string", "null"]
        status:
          type: string
          enum: [active, inactive, suspended]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TenantInput:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        address:
          type: string
        province:
          type: string
        status:
          type: string
          enum: [active, inactive, suspended]

    TenantUpdate:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        contactEmail:
          type: string
        contactPhone:
          type: string
        address:
          type: string
        province:
          type: string
        status:
          type: string
          enum: [active, inactive, suspended]

    # ── DEPARTMENT ──────────────────────────────────────────────────────────────
    Department:
      type: object
      required: [id, tenantId, name, code, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        name:
          type: string
        code:
          type: string
        description:
          type: ["string", "null"]
        parentId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    DepartmentInput:
      type: object
      required: [tenantId, name, code]
      properties:
        tenantId:
          type: integer
        name:
          type: string
        code:
          type: string
        description:
          type: string
        parentId:
          type: integer
        status:
          type: string
          enum: [active, inactive]

    DepartmentUpdate:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        description:
          type: string
        parentId:
          type: integer
        status:
          type: string
          enum: [active, inactive]

    # ── USER ────────────────────────────────────────────────────────────────────
    User:
      type: object
      required: [id, tenantId, firstName, lastName, email, username, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        departmentId:
          type: ["integer", "null"]
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        username:
          type: string
        status:
          type: string
          enum: [active, inactive, suspended]
        lastLoginAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserWithRoles:
      type: object
      required: [id, tenantId, firstName, lastName, email, username, status, roles, createdAt, updatedAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        departmentId:
          type: ["integer", "null"]
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        username:
          type: string
        status:
          type: string
          enum: [active, inactive, suspended]
        lastLoginAt:
          type: ["string", "null"]
          format: date-time
        roles:
          type: array
          items:
            $ref: "#/components/schemas/Role"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    UserInput:
      type: object
      required: [tenantId, firstName, lastName, email, username, password]
      properties:
        tenantId:
          type: integer
        departmentId:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        username:
          type: string
        password:
          type: string
        status:
          type: string
          enum: [active, inactive, suspended]

    UserUpdate:
      type: object
      properties:
        departmentId:
          type: integer
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        username:
          type: string
        status:
          type: string
          enum: [active, inactive, suspended]

    UserStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, inactive, suspended]

    RoleAssignment:
      type: object
      required: [roleId]
      properties:
        roleId:
          type: integer

    # ── ROLE ────────────────────────────────────────────────────────────────────
    Role:
      type: object
      required: [id, tenantId, name, code, createdAt, updatedAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        name:
          type: string
        code:
          type: string
        description:
          type: ["string", "null"]
        isSystem:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RoleWithPermissions:
      type: object
      required: [id, tenantId, name, code, permissions, createdAt, updatedAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        name:
          type: string
        code:
          type: string
        description:
          type: ["string", "null"]
        isSystem:
          type: boolean
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RoleInput:
      type: object
      required: [tenantId, name, code]
      properties:
        tenantId:
          type: integer
        name:
          type: string
        code:
          type: string
        description:
          type: string
        isSystem:
          type: boolean

    RoleUpdate:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
        description:
          type: string

    PermissionAssignment:
      type: object
      required: [permissionId]
      properties:
        permissionId:
          type: integer

    # ── PERMISSION ──────────────────────────────────────────────────────────────
    Permission:
      type: object
      required: [id, module, action, resource]
      properties:
        id:
          type: integer
        module:
          type: string
        action:
          type: string
        resource:
          type: string
        description:
          type: ["string", "null"]

    # ── AUDIT LOG ───────────────────────────────────────────────────────────────
    AuditLog:
      type: object
      required: [id, action, resource, createdAt]
      properties:
        id:
          type: integer
        tenantId:
          type: ["integer", "null"]
        userId:
          type: ["integer", "null"]
        userFullName:
          type: ["string", "null"]
        action:
          type: string
        resource:
          type: string
        resourceId:
          type: ["string", "null"]
        details:
          type: ["string", "null"]
        ipAddress:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    # ── IDENTITY STATS ──────────────────────────────────────────────────────────
    IdentityStats:
      type: object
      required: [totalTenants, activeTenants, totalUsers, activeUsers, totalRoles, totalPermissions, recentLogins]
      properties:
        totalTenants:
          type: integer
        activeTenants:
          type: integer
        totalUsers:
          type: integer
        activeUsers:
          type: integer
        suspendedUsers:
          type: integer
        totalRoles:
          type: integer
        totalPermissions:
          type: integer
        totalDepartments:
          type: integer
        recentLogins:
          type: integer

    # ── WORKFLOW DEFINITION ────────────────────────────────────────────────────
    WorkflowDefinition:
      type: object
      required: [id, tenantId, name, code, resourceType, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        name:
          type: string
        code:
          type: string
        description:
          type: ["string", "null"]
        resourceType:
          type: string
          description: The kind of business record this workflow governs (e.g. "permit_application", "leave_request")
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WorkflowDefinitionInput:
      type: object
      required: [tenantId, name, code, resourceType]
      properties:
        tenantId:
          type: integer
        name:
          type: string
        code:
          type: string
        description:
          type: string
        resourceType:
          type: string
        status:
          type: string
          enum: [active, inactive]

    WorkflowDefinitionUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        resourceType:
          type: string
        status:
          type: string
          enum: [active, inactive]

    WorkflowDefinitionDetail:
      allOf:
        - $ref: "#/components/schemas/WorkflowDefinition"
        - type: object
          required: [versions]
          properties:
            versions:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowVersion"

    # ── WORKFLOW STATE / TRANSITION ────────────────────────────────────────────
    WorkflowState:
      type: object
      required: [id, workflowVersionId, name, code, type, isInitial, isFinal, sortOrder]
      properties:
        id:
          type: integer
        workflowVersionId:
          type: integer
        name:
          type: string
        code:
          type: string
        type:
          type: string
          enum: [draft, review, approved, rejected, completed]
        isInitial:
          type: boolean
        isFinal:
          type: boolean
        sortOrder:
          type: integer

    WorkflowStateInput:
      type: object
      required: [key, name, code]
      properties:
        key:
          type: string
          description: Temporary client-side identifier used to reference this state from a transition's fromKey/toKey in the same request
        name:
          type: string
        code:
          type: string
        type:
          type: string
          enum: [draft, review, approved, rejected, completed]
        isInitial:
          type: boolean
        isFinal:
          type: boolean
        sortOrder:
          type: integer

    WorkflowTransition:
      type: object
      required: [id, workflowVersionId, name, fromStateId, toStateId]
      properties:
        id:
          type: integer
        workflowVersionId:
          type: integer
        name:
          type: string
        fromStateId:
          type: integer
        toStateId:
          type: integer
        requiredPermission:
          type: ["string", "null"]

    WorkflowTransitionInput:
      type: object
      required: [name, fromKey, toKey]
      properties:
        name:
          type: string
        fromKey:
          type: string
          description: Must match a WorkflowStateInput.key in the same request
        toKey:
          type: string
          description: Must match a WorkflowStateInput.key in the same request
        requiredPermission:
          type: string

    # ── WORKFLOW VERSION ───────────────────────────────────────────────────────
    WorkflowVersion:
      type: object
      required: [id, workflowDefinitionId, version, isPublished, createdAt]
      properties:
        id:
          type: integer
        workflowDefinitionId:
          type: integer
        version:
          type: integer
        isPublished:
          type: boolean
        publishedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    WorkflowVersionInput:
      type: object
      required: [states, transitions]
      properties:
        states:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowStateInput"
        transitions:
          type: array
          items:
            $ref: "#/components/schemas/WorkflowTransitionInput"

    WorkflowVersionDetail:
      allOf:
        - $ref: "#/components/schemas/WorkflowVersion"
        - type: object
          required: [states, transitions]
          properties:
            states:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowState"
            transitions:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowTransition"

    # ── WORKFLOW INSTANCE ──────────────────────────────────────────────────────
    WorkflowInstance:
      type: object
      required: [id, workflowVersionId, tenantId, resourceType, resourceId, currentStateId, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        workflowVersionId:
          type: integer
        tenantId:
          type: integer
        resourceType:
          type: string
        resourceId:
          type: string
        currentStateId:
          type: integer
        status:
          type: string
          enum: [in_progress, completed, cancelled]
        initiatedBy:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    WorkflowInstanceInput:
      type: object
      required: [workflowDefinitionId, resourceId]
      properties:
        workflowDefinitionId:
          type: integer
        resourceId:
          type: string
        firstAssigneeUserId:
          type: integer
        firstAssigneeRoleId:
          type: integer

    WorkflowInstanceDetail:
      allOf:
        - $ref: "#/components/schemas/WorkflowInstance"
        - type: object
          required: [currentState, tasks, history]
          properties:
            currentState:
              $ref: "#/components/schemas/WorkflowState"
            tasks:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowTask"
            history:
              type: array
              items:
                $ref: "#/components/schemas/WorkflowHistoryEntry"

    # ── WORKFLOW TASK ──────────────────────────────────────────────────────────
    WorkflowTask:
      type: object
      required: [id, workflowInstanceId, stateId, status, createdAt]
      properties:
        id:
          type: integer
        workflowInstanceId:
          type: integer
        stateId:
          type: integer
        assigneeUserId:
          type: ["integer", "null"]
        assigneeRoleId:
          type: ["integer", "null"]
        status:
          type: string
          enum: [pending, approved, rejected]
        comment:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        resolvedAt:
          type: ["string", "null"]
          format: date-time
        resolvedBy:
          type: ["integer", "null"]

    WorkflowTaskActionInput:
      type: object
      properties:
        transitionId:
          type: integer
          description: Explicit transition to take. If omitted, the transition named "Approve"/"Reject" from the task's current state is used.
        comment:
          type: string
        nextAssigneeUserId:
          type: integer
        nextAssigneeRoleId:
          type: integer

    # ── WORKFLOW HISTORY ───────────────────────────────────────────────────────
    WorkflowHistoryEntry:
      type: object
      required: [id, workflowInstanceId, toStateId, action, createdAt]
      properties:
        id:
          type: integer
        workflowInstanceId:
          type: integer
        transitionId:
          type: ["integer", "null"]
        fromStateId:
          type: ["integer", "null"]
        toStateId:
          type: integer
        actorUserId:
          type: ["integer", "null"]
        action:
          type: string
        comment:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    # ── RULES (Book 06) ────────────────────────────────────────────────────────
    Rule:
      type: object
      required: [id, tenantId, name, code, module, ruleType, resourceType, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        name:
          type: string
        code:
          type: string
        description:
          type: ["string", "null"]
        module:
          type: string
          description: Owning module, e.g. "agriculture", "permits"
        ruleType:
          type: string
          enum: [validation, eligibility, approval, calculation, notification, routing, security, compliance]
        resourceType:
          type: string
          description: The kind of business record this rule evaluates (e.g. "permit_application")
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    RuleInput:
      type: object
      required: [tenantId, name, code, module, ruleType, resourceType]
      properties:
        tenantId:
          type: integer
        name:
          type: string
        code:
          type: string
        description:
          type: string
        module:
          type: string
        ruleType:
          type: string
          enum: [validation, eligibility, approval, calculation, notification, routing, security, compliance]
        resourceType:
          type: string
        status:
          type: string
          enum: [active, inactive]

    RuleUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        module:
          type: string
        ruleType:
          type: string
          enum: [validation, eligibility, approval, calculation, notification, routing, security, compliance]
        resourceType:
          type: string
        status:
          type: string
          enum: [active, inactive]

    RuleDetail:
      allOf:
        - $ref: "#/components/schemas/Rule"
        - type: object
          required: [versions]
          properties:
            versions:
              type: array
              items:
                $ref: "#/components/schemas/RuleVersion"

    # ── RULE GROUP / CONDITION / ACTION ────────────────────────────────────────
    RuleGroup:
      type: object
      required: [id, ruleVersionId, logicalOperator, sortOrder]
      properties:
        id:
          type: integer
        ruleVersionId:
          type: integer
        parentGroupId:
          type: ["integer", "null"]
        logicalOperator:
          type: string
          enum: [AND, OR]
        sortOrder:
          type: integer

    RuleGroupInput:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: Temporary client-side identifier used to reference this group as a parentKey/groupKey elsewhere in the same request
        parentKey:
          type: string
          description: Omit for the single root group of the version
        logicalOperator:
          type: string
          enum: [AND, OR]
        sortOrder:
          type: integer

    RuleCondition:
      type: object
      required: [id, ruleVersionId, groupId, field, operator, value, sortOrder]
      properties:
        id:
          type: integer
        ruleVersionId:
          type: integer
        groupId:
          type: integer
        field:
          type: string
        operator:
          type: string
          enum: [equals, not_equals, greater_than, greater_than_or_equal, less_than, less_than_or_equal, contains, in, not_in]
        value:
          type: string
          description: JSON-encoded literal or array compared against context[field]
        sortOrder:
          type: integer

    RuleConditionInput:
      type: object
      required: [groupKey, field, operator, value]
      properties:
        groupKey:
          type: string
          description: Must match a RuleGroupInput.key in the same request
        field:
          type: string
        operator:
          type: string
          enum: [equals, not_equals, greater_than, greater_than_or_equal, less_than, less_than_or_equal, contains, in, not_in]
        value:
          description: JSON-encodable literal or array compared against context[field]
        sortOrder:
          type: integer

    RuleAction:
      type: object
      required: [id, ruleVersionId, actionType, sortOrder]
      properties:
        id:
          type: integer
        ruleVersionId:
          type: integer
        actionType:
          type: string
          enum: [require_approval, set_field, calculate, notify, route, deny, flag_compliance]
        target:
          type: ["string", "null"]
        value:
          type: ["string", "null"]
        sortOrder:
          type: integer

    RuleActionInput:
      type: object
      required: [actionType]
      properties:
        actionType:
          type: string
          enum: [require_approval, set_field, calculate, notify, route, deny, flag_compliance]
        target:
          type: string
        value:
          type: string
        sortOrder:
          type: integer

    # ── RULE VERSION ────────────────────────────────────────────────────────────
    RuleVersion:
      type: object
      required: [id, ruleId, version, status, priority, createdAt]
      properties:
        id:
          type: integer
        ruleId:
          type: integer
        version:
          type: integer
        status:
          type: string
          enum: [draft, testing, published, active, deprecated, archived]
        priority:
          type: integer
          description: Lower number is evaluated / returned first when multiple active rules match the same request
        effectiveDate:
          type: ["string", "null"]
          format: date-time
        publishedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    RuleVersionInput:
      type: object
      required: [groups, conditions, actions]
      properties:
        priority:
          type: integer
        effectiveDate:
          type: string
          format: date-time
        groups:
          type: array
          items:
            $ref: "#/components/schemas/RuleGroupInput"
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/RuleConditionInput"
        actions:
          type: array
          items:
            $ref: "#/components/schemas/RuleActionInput"

    RuleVersionDetail:
      allOf:
        - $ref: "#/components/schemas/RuleVersion"
        - type: object
          required: [groups, conditions, actions]
          properties:
            groups:
              type: array
              items:
                $ref: "#/components/schemas/RuleGroup"
            conditions:
              type: array
              items:
                $ref: "#/components/schemas/RuleCondition"
            actions:
              type: array
              items:
                $ref: "#/components/schemas/RuleAction"

    # ── RULE EVALUATION ─────────────────────────────────────────────────────────
    RuleEvaluationInput:
      type: object
      required: [tenantId, resourceType, context]
      properties:
        tenantId:
          type: integer
        module:
          type: string
        resourceType:
          type: string
        context:
          type: object
          additionalProperties: true
          description: Field values the engine reads when evaluating conditions

    RuleEvaluationResult:
      type: object
      required: [decisions, failures]
      properties:
        decisions:
          type: array
          items:
            type: object
            required: [ruleId, ruleCode, ruleVersionId, matched, actions]
            properties:
              ruleId:
                type: integer
              ruleCode:
                type: string
              ruleVersionId:
                type: integer
              matched:
                type: boolean
              actions:
                type: array
                items:
                  type: object
                  required: [actionType]
                  properties:
                    actionType:
                      type: string
                    target:
                      type: ["string", "null"]
                    value:
                      type: ["string", "null"]
        failures:
          type: array
          items:
            type: object
            required: [ruleId, error]
            properties:
              ruleId:
                type: integer
              error:
                type: string

    # ── RULE HISTORY ────────────────────────────────────────────────────────────
    RuleHistoryEntry:
      type: object
      required: [id, ruleId, eventType, createdAt]
      properties:
        id:
          type: integer
        ruleId:
          type: integer
        ruleVersionId:
          type: ["integer", "null"]
        eventType:
          type: string
          enum: [published, evaluated, failed, expired, archived]
        context:
          type: ["string", "null"]
          description: JSON snapshot of the evaluation context, when applicable
        result:
          type: ["string", "null"]
          description: JSON snapshot of the decision or error, when applicable
        actorUserId:
          type: ["integer", "null"]
        createdAt:
          type: string
          format: date-time

    # ── FORMS (Book 07) ────────────────────────────────────────────────────────
    Form:
      type: object
      required: [id, tenantId, name, code, module, resourceType, status, createdAt, updatedAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        name:
          type: string
        code:
          type: string
        description:
          type: ["string", "null"]
        module:
          type: string
          description: Owning module, e.g. "agriculture", "permits"
        resourceType:
          type: string
          description: The kind of business record this form collects (e.g. "permit_application")
        workflowDefinitionId:
          type: ["integer", "null"]
          description: Optional; a submitted (non-draft) submission of this form starts an instance of this workflow
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    FormInput:
      type: object
      required: [tenantId, name, code, module, resourceType]
      properties:
        tenantId:
          type: integer
        name:
          type: string
        code:
          type: string
        description:
          type: string
        module:
          type: string
        resourceType:
          type: string
        workflowDefinitionId:
          type: integer
        status:
          type: string
          enum: [active, inactive]

    FormUpdateInput:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        module:
          type: string
        resourceType:
          type: string
        workflowDefinitionId:
          type: integer
        status:
          type: string
          enum: [active, inactive]

    FormVersion:
      type: object
      required: [id, formId, version, status, locale, createdAt]
      properties:
        id:
          type: integer
        formId:
          type: integer
        version:
          type: integer
        status:
          type: string
          enum: [draft, testing, published, active, deprecated, archived]
        locale:
          type: string
        publishedAt:
          type: ["string", "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time

    FormWithVersions:
      allOf:
        - $ref: "#/components/schemas/Form"
        - type: object
          required: [versions]
          properties:
            versions:
              type: array
              items:
                $ref: "#/components/schemas/FormVersion"

    FormSectionInput:
      type: object
      required: [key, title]
      properties:
        key:
          type: string
          description: Temporary client-side identifier used to reference this section as a sectionKey elsewhere in the same request
        tab:
          type: string
          description: Optional grouping label; sections with no tab render ungrouped
        title:
          type: string
        description:
          type: string
        sortOrder:
          type: integer

    FormFieldInput:
      type: object
      required: [sectionKey, fieldKey, label, fieldType]
      properties:
        sectionKey:
          type: string
          description: Must match a section.key in the same request
        fieldKey:
          type: string
          description: Stable key used in submission values and as the Rules Engine context field name
        label:
          type: string
        fieldType:
          type: string
          enum: [text, textarea, number, currency, date, time, select, multi_select, radio, checkbox, switch, file_upload, image, signature, qr_scanner, gps_location, rich_text]
        helpText:
          type: string
        placeholder:
          type: string
        defaultValue:
          description: JSON-encodable default value
        options:
          type: array
          description: For select/multi_select/radio
          items:
            type: object
            required: [label, value]
            properties:
              label:
                type: string
              value: {}
        required:
          type: boolean
        readOnly:
          type: boolean
        hidden:
          type: boolean
        visibilityRuleCode:
          type: string
          description: Rules Engine rule code; field is shown only if that rule matches
        calculationRuleCode:
          type: string
          description: Rules Engine rule code; a matching action targeting this fieldKey overwrites its value
        sortOrder:
          type: integer

    FieldValidationInput:
      type: object
      required: [fieldKey, validationType]
      properties:
        fieldKey:
          type: string
          description: Must match a field.fieldKey in the same request
        validationType:
          type: string
          enum: [required, min, max, regex, range, cross_field, custom_rule]
        config:
          description: Shape depends on validationType (see field_validations schema doc)
        errorMessage:
          type: string
        sortOrder:
          type: integer

    FormVersionInput:
      type: object
      required: [sections, fields, validations]
      properties:
        locale:
          type: string
        sections:
          type: array
          items:
            $ref: "#/components/schemas/FormSectionInput"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FormFieldInput"
        validations:
          type: array
          items:
            $ref: "#/components/schemas/FieldValidationInput"

    FormSection:
      type: object
      required: [id, formVersionId, title, sortOrder]
      properties:
        id:
          type: integer
        formVersionId:
          type: integer
        tab:
          type: ["string", "null"]
        title:
          type: string
        description:
          type: ["string", "null"]
        sortOrder:
          type: integer

    FormField:
      type: object
