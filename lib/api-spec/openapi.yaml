      type: object
      required: [id, tenantId, nodeId, entityType, entityKey, policy, status, createdAt]
      properties:
        id:
          type: integer
        tenantId:
          type: integer
        nodeId:
          type: integer
        entityType:
          type: string
        entityKey:
          type: string
        baseRevision:
          type: integer
          nullable: true
        serverRevision:
          type: integer
          nullable: true
        nodeRevision:
          type: integer
          nullable: true
        serverPayload:
          type: string
          nullable: true
        nodePayload:
          type: string
          nullable: true
        policy:
          type: string
        status:
