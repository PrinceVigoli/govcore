        operator:
          type: string
          enum: [eq, neq, gt, gte, lt, lte, contains, starts_with, in, is_null, is_not_null]
        value:
          description: Operand; omitted for is_null / is_not_null. Array for "in".

    ReportSort:
      type: object
      required: [column]
      properties:
        column:
          type: string
        direction:
          type: string
          enum: [asc, desc]

    ReportSpec:
      type: object
      required: [columns]
      properties:
        columns:
          type: array
          description: Column keys to select; empty selects all of the source's columns
          items:
            type: string
        filters:
          type: array
          items:
            $ref: "#/components/schemas/ReportFilter"
        sort:
          type: array
          items:
            $ref: "#/components/schemas/ReportSort"
        groupBy:
          type: array
          items:
            type: string
