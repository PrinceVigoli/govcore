      type: object
      required: [entityType, entityKey, op, baseRevision]
      properties:
        entityType:
          type: string
        entityKey:
          type: string
        op:
          type: string
          enum: [create, update, delete]
        baseRevision:
          type: integer
          description: The revision the node was working from; 0 for a create
        payload:
          description: Proposed snapshot; omitted for deletes
        updatedAt:
          type: integer
          description: Epoch milliseconds on the node, used only by last_write_wins

