openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: GovCore Platform API — Identity Engine
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: tenants
    description: Tenant management
  - name: departments
    description: Department management
  - name: users
    description: User management
  - name: roles
    description: Role management
  - name: permissions
    description: Permission management
  - name: audit-logs
    description: Audit log operations
  - name: identity-stats
    description: Identity engine dashboard statistics
  - name: workflow-definitions
    description: Workflow definition management (metadata-driven approval processes)
  - name: workflow-versions
    description: Versioned graphs of states and transitions for a workflow definition
  - name: workflow-instances
    description: Running instances of a workflow attached to a business record
  - name: workflow-tasks
    description: Pending approval/rejection work items assigned to a user or role
  - name: workflow-history
    description: Immutable audit trail of workflow state transitions
  - name: forms
    description: Form definitions (Book 07 Forms Engine)
  - name: form-versions
    description: Versioned section/field/validation trees for a form
  - name: form-submissions
    description: Citizen or staff submissions of a form version, including offline sync

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ────────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with username/email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout current session
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithRoles"
        "401":
          description: Not authenticated

  # ─── TENANTS ─────────────────────────────────────────────────────────────────
  /tenants:
    get:
      operationId: listTenants
      tags: [tenants]
      summary: List all tenants
      responses:
        "200":
          description: List of tenants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tenant"
    post:
      operationId: createTenant
      tags: [tenants]
      summary: Create a new tenant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantInput"
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"

  /tenants/{id}:
    get:
      operationId: getTenant
      tags: [tenants]
      summary: Get a tenant by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Not found
    patch:
      operationId: updateTenant
      tags: [tenants]
      summary: Update a tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantUpdate"
      responses:
        "200":
          description: Updated tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tenant"
        "404":
          description: Not found
    delete:
      operationId: deleteTenant
      tags: [tenants]
      summary: Delete a tenant
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ─── DEPARTMENTS ─────────────────────────────────────────────────────────────
  /departments:
    get:
      operationId: listDepartments
      tags: [departments]
      summary: List all departments
      parameters:
        - name: tenantId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of departments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
    post:
      operationId: createDepartment
      tags: [departments]
      summary: Create a department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Department created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"

  /departments/{id}:
    get:
      operationId: getDepartment
      tags: [departments]
      summary: Get a department by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "404":
          description: Not found
    patch:
      operationId: updateDepartment
      tags: [departments]
      summary: Update a department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentUpdate"
      responses:
        "200":
          description: Updated department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "404":
          description: Not found
    delete:
      operationId: deleteDepartment
      tags: [departments]
      summary: Delete a department
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  # ─── USERS ───────────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      parameters:
        - name: tenantId
          in: query
          schema:
            type: integer
        - name: departmentId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get a user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserWithRoles"
        "404":
          description: Not found
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /users/{id}/status:
    patch:
      operationId: updateUserStatus
      tags: [users]
      summary: Update user status (active/inactive/suspended)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserStatusUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found

  /users/{id}/roles:
    get:
      operationId: getUserRoles
      tags: [users]
      summary: List roles assigned to a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      operationId: assignUserRole
      tags: [users]
      summary: Assign a role to a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleAssignment"
      responses:
        "204":
          description: Role assigned

  /users/{id}/roles/{roleId}:
    delete:
      operationId: removeUserRole
      tags: [users]
      summary: Remove a role from a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: roleId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Role removed
        "404":
          description: Not found

  # ─── ROLES ───────────────────────────────────────────────────────────────────
  /roles:
    get:
      operationId: listRoles
      tags: [roles]
      summary: List all roles
      parameters:
        - name: tenantId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Role"
    post:
      operationId: createRole
      tags: [roles]
      summary: Create a role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleInput"
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"

  /roles/{id}:
    get:
      operationId: getRole
      tags: [roles]
      summary: Get a role by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Role with permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleWithPermissions"
        "404":
          description: Not found
    patch:
      operationId: updateRole
      tags: [roles]
      summary: Update a role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoleUpdate"
      responses:
        "200":
          description: Updated role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Role"
        "404":
          description: Not found
    delete:
      operationId: deleteRole
      tags: [roles]
      summary: Delete a role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /roles/{id}/permissions:
    get:
      operationId: getRolePermissions
      tags: [roles]
      summary: List permissions for a role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Role permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
    post:
      operationId: assignRolePermission
      tags: [roles]
      summary: Assign a permission to a role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PermissionAssignment"
      responses:
        "204":
          description: Permission assigned

  /roles/{id}/permissions/{permissionId}:
    delete:
      operationId: removeRolePermission
      tags: [roles]
      summary: Remove a permission from a role
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: permissionId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Permission removed
        "404":
          description: Not found

  # ─── PERMISSIONS ─────────────────────────────────────────────────────────────
  /permissions:
    get:
      operationId: listPermissions
      tags: [permissions]
      summary: List all available permissions
      responses:
        "200":
          description: List of permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"

  # ─── AUDIT LOGS ──────────────────────────────────────────────────────────────
  /audit-logs:
    get:
      operationId: listAuditLogs
      tags: [audit-logs]
      summary: List audit logs
      parameters:
        - name: tenantId
          in: query
          schema:
            type: integer
        - name: userId
          in: query
          schema:
            type: integer
        - name: resource
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  # ─── IDENTITY STATS (wow endpoints) ──────────────────────────────────────────
  /identity/stats:
    get:
      operationId: getIdentityStats
      tags: [identity-stats]
      summary: Identity engine dashboard statistics
      responses:
        "200":
          description: Identity statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityStats"

  /identity/recent-activity:
    get:
      operationId: getRecentActivity
      tags: [identity-stats]
      summary: Recent activity feed from audit logs
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  # ─── WORKFLOW DEFINITIONS ───────────────────────────────────────────────────
  /workflow-definitions:
    get:
      operationId: listWorkflowDefinitions
      tags: [workflow-definitions]
      summary: List workflow definitions
      parameters:
        - name: tenantId
          in: query
          schema:
            type: integer
        - name: resourceType
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of workflow definitions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowDefinition"
    post:
      operationId: createWorkflowDefinition
      tags: [workflow-definitions]
      summary: Create a workflow definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDefinitionInput"
      responses:
        "201":
          description: Workflow definition created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinition"

  /workflow-definitions/{id}:
    get:
      operationId: getWorkflowDefinition
      tags: [workflow-definitions]
      summary: Get a workflow definition by ID, including its versions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Workflow definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinitionDetail"
        "404":
          description: Not found
    patch:
      operationId: updateWorkflowDefinition
      tags: [workflow-definitions]
      summary: Update a workflow definition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowDefinitionUpdate"
      responses:
        "200":
          description: Updated workflow definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinition"
        "404":
          description: Not found
    delete:
      operationId: deleteWorkflowDefinition
      tags: [workflow-definitions]
      summary: Delete a workflow definition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /workflow-definitions/{id}/versions:
    post:
      operationId: createWorkflowVersion
      tags: [workflow-versions]
      summary: Create a new draft version (states + transitions graph) for a workflow definition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowVersionInput"
      responses:
        "201":
          description: Draft version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowVersionDetail"

  # ─── WORKFLOW VERSIONS ───────────────────────────────────────────────────────
  /workflow-versions/{id}:
    get:
      operationId: getWorkflowVersion
      tags: [workflow-versions]
      summary: Get a workflow version, including its full states + transitions graph
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Workflow version detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowVersionDetail"
        "404":
          description: Not found

  /workflow-versions/{id}/publish:
    post:
      operationId: publishWorkflowVersion
      tags: [workflow-versions]
      summary: Publish a draft version so new instances can be started from it
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Published version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowVersion"
        "404":
          description: Not found

  # ─── WORKFLOW INSTANCES ──────────────────────────────────────────────────────
  /workflow-instances:
    get:
      operationId: listWorkflowInstances
      tags: [workflow-instances]
      summary: List workflow instances
      parameters:
        - name: tenantId
          in: query
          schema:
            type: integer
        - name: workflowDefinitionId
          in: query
          schema:
            type: integer
        - name: resourceType
          in: query
          schema:
            type: string
        - name: resourceId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of workflow instances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowInstance"
    post:
      operationId: startWorkflowInstance
      tags: [workflow-instances]
      summary: Start a new workflow instance from the latest published version of a definition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowInstanceInput"
      responses:
        "201":
          description: Workflow instance started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstanceDetail"

  /workflow-instances/{id}:
    get:
      operationId: getWorkflowInstance
      tags: [workflow-instances]
      summary: Get a workflow instance, including its current state, tasks, and history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Workflow instance detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstanceDetail"
        "404":
          description: Not found

  # ─── WORKFLOW TASKS ──────────────────────────────────────────────────────────
  /workflow-tasks:
    get:
      operationId: listWorkflowTasks
      tags: [workflow-tasks]
      summary: List workflow tasks (e.g. "my tasks" inbox)
      parameters:
        - name: assigneeUserId
          in: query
          schema:
            type: integer
        - name: workflowInstanceId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of workflow tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowTask"

  /workflow-tasks/{id}/approve:
    post:
      operationId: approveWorkflowTask
      tags: [workflow-tasks]
      summary: Approve a pending task, advancing the instance along the matching transition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowTaskActionInput"
      responses:
        "200":
          description: Instance advanced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstanceDetail"
        "400":
          description: No matching transition, or task not pending
        "404":
          description: Not found

  /workflow-tasks/{id}/reject:
    post:
      operationId: rejectWorkflowTask
      tags: [workflow-tasks]
      summary: Reject a pending task, advancing the instance along the matching transition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkflowTaskActionInput"
      responses:
        "200":
          description: Instance advanced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowInstanceDetail"
        "400":
          description: No matching transition, or task not pending
        "404":
          description: Not found

  # ─── WORKFLOW HISTORY ────────────────────────────────────────────────────────
  /workflow-history/{instanceId}:
    get:
      operationId: listWorkflowHistory
      tags: [workflow-history]
      summary: Get the immutable transition history for a workflow instance
      parameters:
        - name: instanceId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Workflow history entries, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkflowHistoryEntry"

  # ─── RULES (Book 06) ──────────────────────────────────────────────────────────
  /rules:
    get:
      operationId: listRules
      tags: [rules]
      summary: List rules
      parameters:
        - name: tenantId
          in: query
          schema:
            type: integer
        - name: module
          in: query
          schema:
            type: string
        - name: ruleType
          in: query
          schema:
            type: string
        - name: resourceType
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of rules
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Rule"
