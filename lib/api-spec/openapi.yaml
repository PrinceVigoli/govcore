        tenantId:
          type: integer
        entityType:
          type: string
        conflictPolicy:
          type: string
          enum: [manual, last_write_wins, server_wins, node_wins]
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SyncEntityInput:
      type: object
      required: [entityType]
      properties:
        entityType:
          type: string
