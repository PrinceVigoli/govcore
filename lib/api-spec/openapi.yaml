    SyncPullResult:
      type: object
      required: [changes, nextCursor, hasMore]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/SyncChange"
        nextCursor:
          type: integer
        hasMore:
          type: boolean

